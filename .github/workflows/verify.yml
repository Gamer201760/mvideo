name: Verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked
      - name: Install migration runner
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/amacneil/dbmate/releases/download/v2.36.0/dbmate-linux-amd64 \
            --output "$RUNNER_TEMP/dbmate"
          chmod +x "$RUNNER_TEMP/dbmate"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check code
        run: |
          uv run ruff check .
          uv run mypy .
      - name: Test domain and real storage
        run: |
          uv run pytest tests/unit
          uv run pytest tests/integration

  dataset:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --group data
      - run: uv run --group data pytest data_checks -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run verify

  scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GATEWAY_API_KEY: ""
      E2E_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start portable application
        run: docker compose -p mvideo-ci up --build -d --wait --wait-timeout 180
      - name: Check browser route and accessibility
        run: npm run e2e -- --workers=1
        working-directory: frontend
        env:
          E2E_COMPOSE_PROJECT: mvideo-ci
      - name: Collect application logs
        if: failure()
        run: docker compose -p mvideo-ci logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: frontend/test-results/
          retention-days: 7
      - name: Stop application
        if: always()
        run: docker compose -p mvideo-ci down --volumes
