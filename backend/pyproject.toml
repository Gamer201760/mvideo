[project]
name = "product-attributes"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.143.1", "httpx>=0.28.1", "scikit-learn>=1.9.1", "uvicorn>=0.54.0", "aiosqlite>=0.21.0"]

[dependency-groups]
benchmark = [
    "pyarrow==26.0.0",
]
data = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pandas>=3.0.6",
    "pyarrow==26.0.0",
]
dev = ["mypy>=1.18", "pytest>=8.4", "pytest-xdist>=3.8", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*", "scipy", "scipy.*", "threadpoolctl", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["nbformat", "nbformat.*", "nbclient", "nbclient.*", "jupyter_client", "jupyter_client.*"]
ignore_missing_imports = true
