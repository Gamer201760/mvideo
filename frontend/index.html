<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="%theme.light%" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="%theme.dark%" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="%meta.description%" />
    <meta name="application-name" content="%app.name%" />
    <meta name="apple-mobile-web-app-title" content="%app.name%" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%app.name%" />
    <meta property="og:title" content="%meta.title%" />
    <meta property="og:description" content="%meta.description%" />
    <meta property="og:url" content="%meta.url%" />
    <meta property="og:image" content="%meta.ogImage%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%meta.title%" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%meta.title%" />
    <meta name="twitter:description" content="%meta.description%" />
    <meta name="twitter:image" content="%meta.ogImage%" />
    <title>%meta.title%</title>
    <script>
      try {
        const theme = localStorage.getItem("app-theme")
        const systemDark = matchMedia("(prefers-color-scheme: dark)").matches
        const dark = theme === "dark" || (theme !== "light" && systemDark)
        document.documentElement.dataset.theme = dark ? "dark" : "light"
        const stored = localStorage.getItem("app-locale")
        const preferred = (navigator.languages || [])
          .map((language) => language.slice(0, 2).toLowerCase())
          .find((language) => language === "ru" || language === "en")
        const locale = stored === "ru" || stored === "en" ? stored : preferred
        if (locale !== undefined) document.documentElement.lang = locale
      } catch {
        document.documentElement.dataset.theme = "light"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
